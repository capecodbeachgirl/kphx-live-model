name: KPHX hourly live update + Pages

on:
  schedule:
    # Primary daytime refresh schedule
    - cron: "7,17,27,37,47,57 8-19 * * *"
      timezone: "America/Phoenix"

    # Staggered backup daytime refresh schedule
    - cron: "2,12,22,32,42,52 8-19 * * *"
      timezone: "America/Phoenix"

    # Hourly overnight
    - cron: "5 0-7,20-23 * * *"
      timezone: "America/Phoenix"

  workflow_dispatch:

# Do not allow two hourly refreshes to write the history file at the same time.
concurrency:
  group: kphx-live-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install model
        run: python -m pip install -e .

      - name: Deployment preflight
        run: python scripts/check_deploy_ready.py

      - name: Refresh KPHX dashboard
        env:
          WETHR_API_KEY: ${{ secrets.WETHR_API_KEY }}
        run: python scripts/live_update.py

      - name: Generate KPHX h12+40 shadow forecast
        run: python scripts/generate_h12_40_shadow.py

      - name: Score KPHX h12+40 shadow forecast
        run: python scripts/score_h12_40_shadow.py

      - name: Persist live history and latest dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/live/
          if [ -f data/processed/kphx_h12_40_shadow_log.csv ]; then
            git add data/processed/kphx_h12_40_shadow_log.csv
          fi
          if git diff --cached --quiet; then
            echo "No persisted live-state changes to commit."
          else
            git commit -m "Hourly KPHX dashboard update [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


